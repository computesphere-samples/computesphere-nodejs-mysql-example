name: Publish image

# Builds the image for linux/amd64 and pushes it to quay.io/computesphere/<this repo>.
# A push to main publishes :main and :latest. A version tag (v1.2.3) publishes that tag;
# published version tags are never rebuilt, so the job refuses to overwrite one.
# Pull requests only build it.
on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REPO: quay.io/computesphere/${{ github.event.repository.name }}
      PUSH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Choose tags
        id: tags
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tags=$REPO:$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$REPO:main,$REPO:latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Log in to Quay
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ROBOT_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}
      - name: Refuse to overwrite a published version tag
        if: env.PUSH == 'true' && github.ref_type == 'tag'
        run: |
          if docker buildx imagetools inspect "$REPO:$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::$REPO:$GITHUB_REF_NAME already exists; published tags are immutable. Bump the version."
            exit 1
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
