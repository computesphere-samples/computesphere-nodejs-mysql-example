name: Publish image

# Builds the image for linux/amd64 and pushes it to quay.io/computesphere/<this repo>.
# A push to main publishes :main, :latest and :sha-<commit>. The sha tag never moves, so a
# digest pinned from it stays pullable (Quay won't serve an untagged manifest). A version tag
# (v1.2.3) publishes that tag; published version tags are never rebuilt, so the job refuses
# to overwrite one.
# Pull requests only build it.
on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REPO: quay.io/computesphere/${{ github.event.repository.name }}
      PUSH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Choose tags
        id: tags
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tags=$REPO:$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$REPO:main,$REPO:latest,$REPO:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi
      - name: Log in to Quay
        if: env.PUSH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ROBOT_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}
      - name: Refuse to overwrite a published version tag
        if: env.PUSH == 'true' && github.ref_type == 'tag'
        run: |
          # Only "not found" means unpublished; any other error (network, auth) fails the job.
          ref="$REPO:$GITHUB_REF_NAME"
          if out=$(docker buildx imagetools inspect "$ref" 2>&1); then
            echo "::error::$ref already exists; published tags are immutable. Bump the version."
            exit 1
          fi
          if ! printf '%s\n' "$out" | grep -qiE "$ref: not found|manifest unknown|404 Not Found"; then
            echo "::error::Could not check whether $ref exists: $out"
            exit 1
          fi
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
